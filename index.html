<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111010">
<meta name="color-scheme" content="dark">
<title>Esto es Drunktasy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Modo noche: tabloide impreso en negro. Pensado para usarse de madrugada y con unas copas:
   fondo oscuro, dos fuentes, botones grandes y pocos efectos (solo en los momentos importantes). */
:root{
  --bg:#111010; --card:#1c1a18; --card2:#26231f; --line:#3b3732;
  --fg:#F3EBD3; --fg2:#aaa293;
  --red:#FF3B2F; --red-d:#c9261d; --yellow:#FFE600; --green:#3fd06c; --dark:#111010;
  --head:'Anton', 'Impact', 'Arial Narrow', sans-serif;
  --body:'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --tap:48px;
}
*{box-sizing:border-box; border-radius:0 !important; -webkit-tap-highlight-color:transparent}
html,body{margin:0; background:var(--bg); color:var(--fg)}
body{font-family:var(--body); font-size:17px; line-height:1.45; min-height:100vh}
button{font:inherit; color:inherit; cursor:pointer; border:0; background:none}
i{font-style:normal}
input,textarea,select{font:inherit; font-size:17px; color:var(--fg); background:var(--card); border:2px solid var(--line); padding:12px; width:100%; outline:none; min-height:var(--tap)}
input::placeholder,textarea::placeholder{color:#7d766b}
input:focus,textarea:focus,select:focus{border-color:var(--red)}
#app{max-width:520px; margin:0 auto; padding:0 16px calc(170px + env(safe-area-inset-bottom)); position:relative; overflow:hidden}

/* ---------- CABECERA ---------- */
.mast{border-bottom:2px solid var(--line)}
.logo{font-family:var(--head); text-transform:uppercase; text-align:center; line-height:.9; padding:16px 0 10px}
.logo .el{display:block; font-family:var(--body); font-weight:700; font-size:15px; letter-spacing:.45em; color:var(--fg2); margin-bottom:6px}
.logo .big{display:block; font-size:calc((min(100vw, 520px) - 32px) * .128)}
.logo em, .brand em{font-style:normal; color:var(--red)}
.mast-row{display:flex; align-items:center; gap:8px; min-height:56px}
.brand{font-family:var(--head); font-size:24px; text-transform:uppercase; line-height:1; margin-right:auto; letter-spacing:.01em}
.grp,.who{min-height:40px; padding:0 12px; font-family:var(--body); font-weight:700; font-size:14px; text-transform:uppercase; letter-spacing:.04em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:46%}
.grp{border:2px solid var(--line); color:var(--fg)}
.who{background:var(--fg); color:var(--dark)}
.who.anon{background:var(--red); color:#fff}
.logo + .mast-row{justify-content:space-between}
.logo + .mast-row .grp, .logo + .mast-row .who{max-width:49%}

/* ---------- ÚLTIMA HORA (estático, una línea) ---------- */
.ticker{display:flex; align-items:center; gap:10px; margin:14px 0 0; background:var(--card); border-left:4px solid var(--red); padding:10px 12px; font-size:15px; min-width:0}
.ticker b{font-family:var(--head); font-weight:400; color:var(--red); text-transform:uppercase; letter-spacing:.03em; flex:none}
.ticker span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0}

/* ---------- SELLOS (solo para lo importante) ---------- */
.stamp{display:inline-block; font-family:var(--head); text-transform:uppercase; letter-spacing:.04em; padding:3px 8px 2px; border:2px solid currentColor; line-height:1.05; font-size:15px; white-space:nowrap}
.stamp.excl{background:var(--yellow); color:var(--dark); border-color:var(--yellow); transform:rotate(-4deg)}
.stamp.red{color:var(--red)}
.stamp.ok{color:var(--green)}
.stamp.pend{color:var(--yellow); border-style:dashed}
.stamp.ink{color:var(--fg2)}

/* ---------- PORTADA ---------- */
.kick-row{display:flex; align-items:center; gap:10px; margin:22px 0 6px; flex-wrap:wrap}
.kicker{font-weight:700; text-transform:uppercase; letter-spacing:.06em; font-size:14px; color:var(--red)}
.halftone{position:absolute; inset:0; background:radial-gradient(var(--fg) 1.2px, transparent 1.5px) 0 0/7px 7px; opacity:.08}
.lede{font-size:17px; margin:14px 0 0; color:var(--fg)}
.lede b{color:var(--fg)}
.rule{border:0; border-top:2px solid var(--line); margin:24px 0 14px}
.sect{font-family:var(--head); font-weight:400; font-size:30px; text-transform:uppercase; line-height:.95; margin:0 0 4px}
.sect small{display:block; font-family:var(--body); font-size:15px; text-transform:none; color:var(--fg2); margin-top:6px; line-height:1.3}

.rank{list-style:none; margin:10px 0 0; padding:0; border-top:2px solid var(--line)}
.rank li{display:grid; grid-template-columns:44px 1fr auto; gap:10px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line)}
.rank .n{font-family:var(--head); font-size:30px; line-height:1; text-align:center; color:var(--fg2)}
.rank li:nth-child(-n+3) .n{color:var(--red)}
.rank .nm{font-family:var(--head); font-size:21px; text-transform:uppercase; line-height:1}
.rank .pt{font-family:var(--head); font-size:24px; text-align:right; line-height:1}
.rank .pt small{display:block; font-family:var(--body); font-weight:700; font-size:11px; letter-spacing:.06em; color:var(--fg2)}
.monje{margin:18px 0 0; background:var(--card); border-left:4px solid var(--fg2); padding:14px}
.monje .stamp{margin-bottom:8px}
.monje h3{font-family:var(--head); font-weight:400; font-size:26px; margin:0; text-transform:uppercase; line-height:.95}
.monje p{margin:6px 0 0; color:var(--fg2)}

/* Podio por escalones */
.podium{display:grid; grid-template-columns:1fr 1.25fr 1fr; align-items:end; gap:6px; margin:22px 0 0; border-bottom:4px solid var(--line)}
.pod{display:flex; flex-direction:column; text-align:center; min-width:0}
.pod .crown{align-self:center; margin:0 0 12px; font-size:13px}
.pod .face{aspect-ratio:1; background:var(--card2); position:relative; overflow:hidden; display:grid; place-items:center; margin:0 4px 8px}
.pod .face img{width:100%; height:100%; object-fit:cover; filter:grayscale(1) contrast(1.2)}
.pod .ini{font-family:var(--head); font-size:40px; line-height:1; position:relative; color:var(--fg)}
.pod.p1 .ini{font-size:58px; color:var(--red)}
.pod .pn{font-family:var(--head); text-transform:uppercase; font-size:17px; line-height:1; overflow-wrap:anywhere; padding:0 2px}
.pod.p1 .pn{font-size:21px}
.pod .pp{font-family:var(--head); font-size:22px; color:var(--red); line-height:1; margin:4px 0 8px}
.pod .pp small{font-family:var(--body); font-weight:700; font-size:11px; color:var(--fg2); margin-left:3px}
.pod .step{background:var(--card2); color:var(--fg2); font-family:var(--head); line-height:1; display:flex; justify-content:center; padding-top:10px; font-size:40px}
.pod.p1 .step{height:128px; background:var(--red); color:#fff; font-size:62px}
.pod.p2 .step{height:90px}
.pod.p3 .step{height:62px}

/* ---------- VACÍO ---------- */
.empty{margin:30px 0; text-align:center; padding:26px 14px; border:2px dashed var(--line)}
.empty h2{font-family:var(--head); font-weight:400; text-transform:uppercase; font-size:40px; line-height:.92; margin:12px 0}
.empty p{margin:0 0 16px; color:var(--fg2)}
.empty small{color:var(--fg2)}

/* ---------- BOTONES ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; min-height:56px; font-family:var(--head); font-weight:400; text-transform:uppercase; font-size:22px; letter-spacing:.03em; padding:10px 18px 8px; background:var(--fg); color:var(--dark); transition:transform .06s}
.btn:active{transform:scale(.97)}
.btn.red{background:var(--red); color:#fff}
.btn.ghost{background:transparent; color:var(--fg); border:2px solid var(--line)}
.btn.block{display:flex; width:100%}
.btn.sm{font-size:18px; min-height:var(--tap); padding:8px 12px 6px}
.btn[disabled]{opacity:.35; pointer-events:none}

/* ---------- CONFESAR ---------- */
.grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:12px 0}
.grid.g2{grid-template-columns:repeat(2,1fr); gap:10px}
.opt{background:var(--card); border:2px solid var(--card); padding:10px 6px 8px; text-align:center; min-height:88px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; transition:transform .06s, background .15s}
.opt:active{transform:scale(.96)}
.opt .e{font-size:30px; line-height:1}
.opt .l{font-weight:700; text-transform:uppercase; font-size:13px; line-height:1.1}
.opt .p{font-family:var(--head); font-size:17px; color:var(--red)}
.opt.on{border-color:var(--red); background:var(--card2)}
.opt.add{border:2px dashed var(--line); background:transparent}
.drinks .opt{min-height:128px}
.drinks .opt .e{font-size:42px}
.drinks .opt .l{font-size:16px}
.drinks .opt .p{font-size:24px}
.opt.hit{background:var(--red); border-color:var(--red)}
.opt.hit .p{color:#fff}
.hint{color:var(--fg2); font-size:15px; text-align:center; margin:4px 0 0}
.tabs2{display:grid; grid-template-columns:1fr 1fr; border:2px solid var(--line); margin:12px 0}
.tabs2 button{font-family:var(--head); font-size:18px; text-transform:uppercase; min-height:var(--tap); padding:8px 4px 6px; color:var(--fg2)}
.tabs2 button.on{background:var(--red); color:#fff}
.tabs2.rk{margin:12px 0 0}
.tabs2.rk button.on{background:var(--fg); color:var(--dark)}
.field{margin:10px 0}
.field label{display:block; font-weight:700; text-transform:uppercase; font-size:13px; letter-spacing:.06em; margin-bottom:4px; color:var(--fg2)}
.file-btn{display:flex; align-items:center; gap:10px; border:2px dashed var(--line); padding:10px; min-height:var(--tap); font-weight:700; text-transform:uppercase; font-size:14px; color:var(--fg2)}
.file-btn img{width:56px; height:56px; object-fit:cover; filter:grayscale(1)}
.sins{list-style:none; padding:0; margin:8px 0; border-top:1px solid var(--line)}
.sins li{display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid var(--line); gap:8px}
.sins .x{font-weight:700; font-size:13px; text-transform:uppercase; color:var(--red); border:2px solid var(--red); padding:0 10px; min-height:40px; flex:none}
.sins .x.armed{background:var(--red); color:#fff}

/* ---------- MURO / JUICIO ---------- */
.story{margin:18px 0; background:var(--card); border-left:4px solid var(--line); padding:14px}
.story.pending{border-left-color:var(--yellow)}
.story .st{margin-bottom:8px; font-size:14px}
.story .cat{font-weight:700; text-transform:uppercase; font-size:13px; letter-spacing:.06em; color:var(--red); display:flex; justify-content:space-between}
.story h3{font-family:var(--head); font-weight:400; text-transform:uppercase; font-size:25px; line-height:1; margin:8px 0 6px}
.story .note{margin:6px 0; color:var(--fg)}
.story .note::before{content:"«"} .story .note::after{content:"»"}
.story .meta{font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--fg2); margin-top:8px; display:flex; justify-content:space-between; gap:8px}
.story .ph{margin:10px 0 4px; aspect-ratio:4/3; background:var(--card2); overflow:hidden}
.story .ph img{width:100%; height:100%; object-fit:cover; filter:grayscale(1) contrast(1.2)}
.votes{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px}
.votes .btn{min-height:56px}
.bar{height:12px; display:flex; margin-top:12px; background:var(--card2)}
.bar i{display:block; height:100%}
.bar .y{background:var(--red)} .bar .no{background:var(--fg2); margin-left:auto}
.tally{font-weight:700; font-size:13px; text-transform:uppercase; display:flex; justify-content:space-between; margin-top:6px; color:var(--fg2)}

/* ---------- ARCHIVO ---------- */
.ficha{background:var(--card); padding:14px; margin:14px 0}
.ficha .fh{display:flex; justify-content:space-between; align-items:center; gap:8px; font-weight:700; font-size:12px; letter-spacing:.08em; color:var(--fg2); border-bottom:1px solid var(--line); padding-bottom:10px}
.ficha .fh .stamp{font-size:13px}
.ficha .fid{display:grid; grid-template-columns:64px 1fr; gap:12px; align-items:center; margin:12px 0}
.ficha .face{aspect-ratio:1; background:var(--card2); position:relative; overflow:hidden; display:grid; place-items:center}
.ficha .ini{font-family:var(--head); font-size:30px; position:relative; color:var(--red)}
.ficha h3{font-family:var(--head); font-weight:400; font-size:25px; text-transform:uppercase; line-height:.95; margin:0; overflow-wrap:anywhere}
.fstats{display:grid; grid-template-columns:repeat(4,1fr); margin:0 0 8px; border-top:1px solid var(--line); border-bottom:1px solid var(--line)}
.fstats div{text-align:center; padding:8px 2px; border-left:1px solid var(--line)}
.fstats div:first-child{border-left:0}
.fstats dt{font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:.03em; line-height:1.1; color:var(--fg2)}
.fstats dd{margin:3px 0 0; font-family:var(--head); font-size:24px; line-height:1}
.fl{font-size:15px; margin:8px 0}
.fl b{text-transform:uppercase; font-size:12px; letter-spacing:.06em; color:var(--fg2)}
.mini{background:var(--card); border-top:4px solid var(--red); padding:12px 14px 14px; margin:14px 0}
.mini .mmast{display:flex; justify-content:space-between; font-weight:700; font-size:12px; text-transform:uppercase; letter-spacing:.1em; color:var(--fg2); border-bottom:1px solid var(--line); padding-bottom:6px}
.mini .mmast span:first-child{font-family:var(--head); font-weight:400; font-size:15px; letter-spacing:.04em; color:var(--fg)}
.mini h3{font-family:var(--head); font-weight:400; font-size:26px; text-transform:uppercase; line-height:.98; margin:10px 0 4px}
.mini .rank li{padding:6px 0; grid-template-columns:36px 1fr auto}
.mini .rank .n{font-size:22px} .mini .rank .nm{font-size:17px} .mini .rank .pt{font-size:19px}
.badges{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
.badge{font-weight:700; font-size:12px; text-transform:uppercase; padding:3px 8px; background:var(--yellow); color:var(--dark)}

/* ---------- BARRA INFERIOR ---------- */
nav.bottom{position:fixed; left:0; right:0; bottom:0; z-index:40; background:#0a0909; border-top:2px solid var(--line); padding-bottom:env(safe-area-inset-bottom)}
nav.bottom .in{max-width:520px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr)}
nav.bottom button{color:var(--fg2); font-family:var(--head); font-size:16px; text-transform:uppercase; min-height:58px; letter-spacing:.03em; position:relative; line-height:1}
nav.bottom button.on{color:var(--fg); box-shadow:inset 0 3px 0 var(--fg)}
nav.bottom button.cf{background:var(--red); color:#fff}
nav.bottom button.cf.on{box-shadow:inset 0 3px 0 #fff}
nav.bottom .dot{position:absolute; top:6px; right:10px; background:var(--yellow); color:var(--dark); font-family:var(--body); font-size:12px; font-weight:700; padding:0 5px; min-width:18px}

/* ---------- VENTANAS ---------- */
#modal{position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.75); display:none; align-items:flex-end; justify-content:center}
#modal.show{display:flex}
#modal .sheet{background:var(--bg); width:100%; max-width:520px; max-height:92vh; overflow:auto; border-top:4px solid var(--red); padding:18px 16px calc(20px + env(safe-area-inset-bottom)); animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px); opacity:0}}
.sheet h2{font-family:var(--head); font-weight:400; font-size:32px; text-transform:uppercase; line-height:.95; margin:0 0 4px}
.sheet .x{float:right; font-family:var(--head); font-size:24px; line-height:1; min-width:var(--tap); min-height:var(--tap); margin:-12px -8px 0 0; color:var(--fg2)}
.sheet-foot{position:sticky; bottom:calc(-20px - env(safe-area-inset-bottom)); margin:14px -16px calc(-20px - env(safe-area-inset-bottom)); padding:12px 16px calc(14px + env(safe-area-inset-bottom)); background:var(--bg); border-top:1px solid var(--line)}
.plist{list-style:none; padding:0; margin:12px 0; border-top:1px solid var(--line)}
.plist button{display:flex; justify-content:space-between; width:100%; min-height:56px; padding:8px 6px; border-bottom:1px solid var(--line); text-align:left; align-items:center; gap:8px}
.plist button b{font-family:var(--head); font-size:21px; text-transform:uppercase; font-weight:400}
.plist button i{font-size:14px; font-style:normal; color:var(--fg2)}
.plist button.me{background:var(--fg); color:var(--dark)}
.plist button.me i{color:var(--dark)}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.mode-note{font-size:14px; font-weight:700; background:var(--yellow); color:var(--dark); padding:8px 10px; margin:14px 0 0}
.small{font-size:15px; color:var(--fg2)}
code{font-size:13px; word-break:break-all; background:var(--card); padding:6px 8px; display:block; color:var(--fg)}

/* ---------- AVISOS (abajo, junto al pulgar) ---------- */
#toast{position:fixed; left:50%; bottom:calc(70px + env(safe-area-inset-bottom)); transform:translate(-50%,160%); z-index:80; width:calc(100% - 24px); max-width:496px; background:var(--fg); color:var(--dark); padding:8px 8px 8px 14px; min-height:56px; display:flex; align-items:center; gap:10px; font-weight:700; font-size:16px; line-height:1.25; transition:transform .25s ease-out, opacity .2s, visibility 0s .25s; box-shadow:0 6px 24px rgba(0,0,0,.6); opacity:0; visibility:hidden; pointer-events:none}
#toast span{flex:1}
#toast button{flex:none; font-family:var(--head); font-size:18px; text-transform:uppercase; background:var(--dark); color:var(--fg); min-height:40px; padding:0 14px}
#toast.show{transform:translate(-50%,0); opacity:1; visibility:visible; pointer-events:auto; transition:transform .25s ease-out, opacity .2s}
#modal.show ~ #toast{bottom:calc(104px + env(safe-area-inset-bottom))}
#toast.alarm{background:var(--red); color:#fff}
#stampfx{position:fixed; inset:0; z-index:90; display:none; place-items:center; pointer-events:none; background:rgba(0,0,0,.55)}
#stampfx.show{display:grid}
#stampfx .big{font-family:var(--head); font-size:min(19vw,100px); text-transform:uppercase; padding:6px 20px 2px; border:6px solid var(--dark); background:var(--yellow); color:var(--dark); text-align:center; line-height:.95}
#stampfx .big small{display:block; font-family:var(--body); font-size:15px; letter-spacing:.04em; font-weight:700; padding-bottom:6px}
#stampfx.show .big{animation:slam .62s cubic-bezier(.3,0,.4,1) forwards}
@keyframes slam{
  0%{transform:scale(3.4) rotate(-32deg); opacity:0}
  48%{transform:scale(.88) rotate(-11deg); opacity:1}
  64%{transform:scale(1.08) rotate(-13deg)}
  80%{transform:scale(.97) rotate(-12deg)}
  100%{transform:scale(1) rotate(-12deg); opacity:1}
}
.shake{animation:shake .35s .28s}
@keyframes shake{20%{transform:translate(-7px,4px)}40%{transform:translate(6px,-5px)}60%{transform:translate(-4px,3px)}80%{transform:translate(3px,-2px)}}
#breaking{position:fixed; inset:0; z-index:95; display:none; background:var(--bg); color:var(--fg); flex-direction:column; justify-content:center; padding:24px; text-align:left; border-left:10px solid var(--red)}
#breaking.show{display:flex; animation:up .25s ease-out}
#breaking .lb{font-family:var(--head); font-size:24px; background:var(--red); color:#fff; padding:4px 10px 2px; width:max-content}
#breaking h1{font-family:var(--head); font-weight:400; text-transform:uppercase; font-size:min(14vw,70px); line-height:.9; margin:16px 0}
#breaking p{font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--fg2)}
@media (prefers-reduced-motion: reduce){ #stampfx.show .big{animation:none; transform:rotate(-12deg)} .shake{animation:none} }
</style>
</head>
<body>
<div id="app"></div>
<nav class="bottom"><div class="in" id="nav"></div></nav>
<div id="modal"></div>
<div id="toast"></div>
<div id="stampfx"><div class="big"></div></div>
<div id="breaking"></div>

function ago(t){
  const s = (Date.now() - new Date(t)) / 1000;
  if (s < 60) return 'hace un momento';
  if (s < 3600) return 'hace '+Math.floor(s/60)+' min';
  if (s < 86400) return 'hace '+Math.floor(s/3600)+' h';
  const d = Math.floor(s/86400); return d===1 ? 'ayer' : 'hace '+d+' días';
}

function jag(seed){
  let s = seed; const r = () => { s = (s*9301+49297) % 233280; return s/233280 };
  const N = 16, a = 2.6, P = [];
  for(let i=0;i<=N;i++) P.push(`${(i/N*100).toFixed(1)}% ${(r()*a).toFixed(1)}%`);
  for(let i=1;i<=N;i++) P.push(`${(100-r()*a).toFixed(1)}% ${(i/N*100).toFixed(1)}%`);
  for(let i=N-1;i>=0;i--) P.push(`${(i/N*100).toFixed(1)}% ${(100-r()*a).toFixed(1)}%`);
  for(let i=N-1;i>=1;i--) P.push(`${(r()*a).toFixed(1)}% ${(i/N*100).toFixed(1)}%`);
  return `polygon(${P.join(',')})`;
}

function resolveConfig(){

function remoteDB(cfg){
  const base = cfg.url.replace(/\/+$/,'') + '/rest/v1/';
  const H = {apikey:cfg.key, Authorization:'Bearer '+cfg.key, 'Content-Type':'application/json'};
  async function req(path, opts={}){
    const r = await fetch(base+path, {...opts, headers:{...H, ...(opts.headers||{})}});
    if (!r.ok) throw new Error(r.status+' '+(await r.text()));
    const t = await r.text(); return t ? JSON.parse(t) : null;
  }
  const T = t => 'ddv_'+t;
  return {
    remote:true,
    list: (t, gid) => req(`${T(t)}?select=${t==='events'?EVENT_COLS:'*'}&group_id=eq.${encodeURIComponent(gid)}&order=created_at.asc`),
    find: (t, field, value) => req(`${T(t)}?${field}=eq.${encodeURIComponent(value)}&select=${t==='events'?EVENT_COLS:'*'}`),
    insert: (t,row) => req(T(t), {method:'POST', headers:{Prefer:'return=representation'}, body:JSON.stringify(row)}).then(r=>r[0]),
    update: (t,id,patch) => req(`${T(t)}?id=eq.${encodeURIComponent(id)}`, {method:'PATCH', body:JSON.stringify(patch)}),
    remove: (t,id) => req(`${T(t)}?id=eq.${encodeURIComponent(id)}`, {method:'DELETE'}),
    vote: (row) => req(`${T('votes')}?on_conflict=event_id,voter_id`, {method:'POST', headers:{Prefer:'resolution=merge-duplicates,return=minimal'}, body:JSON.stringify(row)}),
    photo: (id) => req(`${T('events')}?id=eq.${encodeURIComponent(id)}&select=photo`).then(r => r[0] && r[0].photo),
  };
}
function localDB(){
  const load = () => ({groups:[], players:[], events:[], votes:[], categories:[], ...LS.get('ddv_local', {})});
  const save = db => LS.set('ddv_local', db);
  const strip = rows => rows.map(({photo, ...r}) => r);
  return {
    remote:false,
    async list(t, gid){ const rows = (load()[t] || []).filter(r => r.group_id===gid); return t==='events' ? strip(rows) : rows },
    async find(t, field, value){ const rows = (load()[t] || []).filter(r => r[field]===value); return t==='events' ? strip(rows) : rows },
    async insert(t,row){ const db = load(); const r = {id:uid(), created_at:new Date().toISOString(), ...row}; db[t].push(r); save(db); return t==='events' ? (({photo,...x})=>x)(r) : r },
    async update(t,id,patch){ const db = load(); db[t] = db[t].map(r => r.id===id ? {...r, ...patch} : r); save(db) },
    async remove(t,id){ const db = load(); db[t] = db[t].filter(r => r.id!==id); if (t==='events') db.votes = db.votes.filter(v => v.event_id!==id); save(db) },
    async vote(row){ const db = load(); db.votes = db.votes.filter(v => !(v.event_id===row.event_id && v.voter_id===row.voter_id)); db.votes.push({created_at:new Date().toISOString(), ...row}); save(db) },
    async photo(id){ const e = load().events.find(e => e.id===id); return e && e.photo },
  };
}

/* ---------------- lógica del juicio ---------------- */
function verdict(e){
  if (e.status !== 'pending') return e.status;
  const vs = S.votes.filter(v => v.event_id===e.id);
  const n = S.players.filter(p => p.id!==e.player_id).length;
  const yes = vs.filter(v => v.approve).length, no = vs.length - yes;
  if (n === 0 || yes > n/2) return 'approved';
  if (no >= n/2) return 'rejected';
  return 'pending';
}
async function settlePending(){
  const jobs = [];
  for (const e of S.events) {
    if (e.status !== 'pending') continue;
    const v = verdict(e);
    if (v !== 'pending') { e.status = v; jobs.push(DB.update('events', e.id, {status:v})) }
  }
  await Promise.allSettled(jobs);
}

/* ---------------- clasificaciones ---------------- */
// month = 'YYYY-MM' para una temporada; null = histórico (todo lo acumulado)
function playersAt(month){ return month ? S.players.filter(p => monthKey(p.created_at) <= month) : S.players }
function standings(month){
  const ps = playersAt(month);
  const rows = ps.map(p => ({p, points:0, drinks:0, anec:0, pending:0}));
  const by = Object.fromEntries(rows.map(r => [r.p.id, r]));
  for (const e of S.events) {
    if ((month && e.month !== month) || !by[e.player_id]) continue;
    const r = by[e.player_id];
    if (e.status === 'approved') { r.points += e.points; e.kind==='drink' ? r.drinks++ : r.anec++ }
    else if (e.status === 'pending') r.pending++;
  }
  return rows.sort((a,b) => b.points-a.points || b.anec-a.anec || a.p.nickname.localeCompare(b.p.nickname));
}
function seasons(){
  const cm = curMonth();
  return [...new Set(S.events.map(e => e.month))].filter(m => m < cm).sort().reverse();
}
function podiumCount(pid){
  return seasons().filter(m => standings(m).slice(0,3).some(r => r.p.id===pid && r.points>0)).length;
}

/* ---------------- medallas ---------------- */
function medals(month){
  const ev = S.events.filter(e => e.month===month && e.status==='approved');
  const ps = playersAt(month);
  const out = [];
  const count = (f) => { const c = {}; ev.filter(f).forEach(e => c[e.player_id] = (c[e.player_id]||0)+1); return c };
  const top = (c, min) => Object.entries(c).filter(([,n]) => n>=min).sort((a,b) => b[1]-a[1]);

  const active = new Set(S.events.filter(e => e.month===month).map(e => e.player_id));
  ps.filter(p => !active.has(p.id)).forEach(p => out.push({t:'El Fantasma', e:'👻', pid:p.id, d:'Ni está ni se le espera. Cero apariciones este mes.'}));

  top(count(e => { const h = new Date(e.created_at).getHours(); return h>=3 && h<6 }), 2)
    .slice(0,1).forEach(([pid,n]) => out.push({t:'El Filósofo de las 4AM', e:'🦉', pid, d:`${n} confesiones entre las 3 y las 6. Ahí arregla el mundo.`}));

  const nights = {};
  ev.forEach(e => { const k = new Date(new Date(e.created_at) - 8*3600e3).toDateString(); if (!nights[k] || nights[k].created_at < e.created_at) nights[k] = e });
  const last = {}; Object.values(nights).forEach(e => last[e.player_id] = (last[e.player_id]||0)+1);
  top(last, 2).slice(0,1).forEach(([pid,n]) => out.push({t:'El Que Siempre Dice La Última', e:'🔔', pid, d:`Cerró ${n} noches. «La última y nos vamos», dijo. Mentía.`}));

  ps.forEach(p => { const n = podiumCount(p.id); if (n >= 3) out.push({t:'Reincidente', e:'🔁', pid:p.id, d:`${n} meses en el podio. El juez ya le llama por su nombre.`}) });

  return out.filter(m => player(m.pid));
}

function checkNotifications(){
  // Delaciones contra mí
  if (S.me) {
    const seen = LS.get('ddv_seen', []);
    const fresh = S.events.filter(e => e.status==='pending' && e.player_id===S.me && e.reported_by && !seen.includes(e.id));
    if (fresh.length) { toast('Alguien te ha delatado. El pueblo decidirá.', true, 4200); LS.set('ddv_seen', [...seen, ...fresh.map(e => e.id)].slice(-300)) }
  }
  // Cambio de líder
  const st = standings(curMonth());
  const lead = st[0] && st[0].points>0 ? st[0].p.id : null;
  const key = 'ddv_leader_'+S.group+'_'+curMonth();
  const prev = LS.get(key, undefined);
  // prev === undefined → primera visita del mes en este móvil: se apunta sin escándalo
  if (lead && prev !== undefined && prev !== lead) breaking(st[0].p);
  LS.set(key, lead);
}

    : `<p class="lede"><b>${esc(L.p.name)}</b> lidera ${esc(MONTHS[+m.split('-')[1]-1])} con ${L.drinks} ${L.drinks===1?'copa':'copas'} y ${L.anec} ${L.anec===1?'anécdota':'anécdotas'}. ${second ? `Le saca ${gap} a «${esc(second.p.nickname)}».` : 'Nadie le hace sombra.'} Cierre de edición en ${daysLeft()} días.</p>`;

function viewMuro(){
  const pend = S.events.filter(e => e.status==='pending').slice().reverse();
  const ok = S.events.filter(e => e.kind==='anecdote' && e.status==='approved').slice().reverse();
  let h = '';

  h += pend.map(e => {
    const vs = S.votes.filter(v => v.event_id===e.id);
    const n = S.players.filter(p => p.id!==e.player_id).length;
    const yes = vs.filter(v => v.approve).length, no = vs.length-yes;
    const mine = vs.find(v => v.voter_id===S.me);
    const need = Math.floor(n/2)+1;
    let ctl;
    if (!S.me) ctl = '<p class="small"><i>Identifícate para votar.</i></p>';
    else if (e.player_id===S.me) ctl = '<p class="small" style="margin-top:10px"><b>Tú calla, que estás acusado.</b> El pueblo decide.</p>';

      <div class="tally"><span>${yes} culpable</span><span>Hacen falta ${need} de ${n}</span><span>${no} inocente</span></div>${ctl}`;
    return story(e, {extra});
  }).join('');
  h += `${pend.length ? '<hr class="rule">' : ''}<h2 class="sect" style="font-size:36px;margin-top:20px">Muro de la vergüenza</h2>`;
  if (!ok.length) h += emptyBlock('Hoy no hay escándalos.', 'Sospechoso.', '<button class="btn red" data-a="tab" data-v="confesar">CONFESAR</button>');
  return h + ok.slice(0,60).map(e => story(e)).join('');
}
// Archivo: expedientes de cada jugador + hemeroteca con una mini portada por mes pasado
function ficha(p, i, tot){
  const mine = S.events.filter(e => e.player_id===p.id && e.status==='approved');
  const won = seasons().filter(s => { const w = standings(s)[0]; return w && w.p.id===p.id && w.points>0 }).length;
  const pods = podiumCount(p.id);
  const byDrink = {};
  mine.filter(e => e.kind==='drink').forEach(e => byDrink[e.type] = (byDrink[e.type]||0)+1);
  const fav = Object.entries(byDrink).sort((a,b) => b[1]-a[1])[0];
  const favD = fav && DRINKS.find(d => d.type===fav[0]);
  const worst = mine.filter(e => e.kind==='anecdote').sort((a,b) => b.points-a.points || (b.created_at > a.created_at ? 1 : -1))[0];
  const honors = {};
  [...seasons(), curMonth()].forEach(mo => medals(mo).filter(x => x.pid===p.id).forEach(x => {
    const h = honors[x.t] || (honors[x.t] = {e:x.e, n:0}); h.n = x.t==='Reincidente' ? 1 : h.n+1 }));
  const stampTxt = won ? `CAMPEÓN ×${won}` : pods ? 'FICHADO' : 'SIN ANTECEDENTES';
  return `<article class="ficha">
    <div class="fh"><span>EXPEDIENTE Nº ${String(i+1).padStart(3,'0')}</span><span class="stamp ${won?'red':'ink'}">${stampTxt}</span></div>
    <div class="fid"><div class="face clip2"><div class="halftone"></div><span class="ini">${esc(initials(p))}</span></div>
      <div><h3>«${esc(p.nickname)}»</h3><p class="small">${esc(p.name)} · en la cuadrilla desde ${esc(monthName(monthKey(p.created_at)))}</p></div></div>
    <dl class="fstats"><div><dt>Puntos</dt><dd>${tot.points}</dd></div><div><dt>Meses ganados</dt><dd>${won}</dd></div><div><dt>Podios</dt><dd>${pods}</dd></div><div><dt>Copas</dt><dd>${tot.drinks}</dd></div></dl>
    <p class="fl"><b>Bebida de cabecera:</b> ${favD ? `${favD.emoji} ${esc(favD.label)} (${fav[1]})` : 'Agua, dice.'}</p>
    <p class="fl"><b>Su peor momento:</b> ${worst ? esc(headline(worst)) : 'Limpio. Demasiado limpio.'}</p>
    <div class="badges">${Object.keys(honors).length ? Object.entries(honors).map(([t,h]) => `<span class="badge">${h.e} ${esc(t)}${h.n>1?' ×'+h.n:''}</span>`).join('') : '<span class="small"><i>Sin honores. De momento.</i></span>'}</div>
  </article>`;
}
function miniPortada(s){
  const st = standings(s), W = st[0], M = st.length>1 ? st[st.length-1] : null;
  const star = S.events.filter(e => e.month===s && e.kind==='anecdote' && e.status==='approved').sort((a,b) => b.points-a.points)[0];
  const mes = MONTHS[+s.split('-')[1]-1];
  return `<article class="mini">
    <div class="mmast"><span>DRUNKTASY</span><span>${esc(monthName(s))}</span></div>
    <h3>${W && W.points ? `«${esc(up(W.p.nickname))}» SE CORONA EN ${esc(up(mes))}` : 'MES EN BLANCO. NADIE SE MOJÓ'}</h3>
    ${W && W.points ? `<ol class="rank">${rankRows(st.slice(0,3))}</ol>` : ''}
    ${M && W && W.points ? `<p class="fl"><b>El Monje:</b> «${esc(M.p.nickname)}», con ${M.points} ${M.points===1?'punto':'puntos'}.</p>` : ''}
    ${star ? `<p class="fl"><b>Anécdota estrella:</b> ${esc(headline(star))}</p>` : ''}
  </article>`;
}
function viewHemeroteca(){
  let h = `<div style="height:12px"></div><h2 class="sect" style="font-size:40px">Archivo<small>Lo escrito, escrito queda.</small></h2>`;
  h += `<h2 class="sect" style="margin-top:18px">Expedientes<small>Todo lo que la redacción sabe de cada uno.</small></h2>`;
  const all = standings(null);
  h += all.length ? all.map(r => ficha(r.p, S.players.indexOf(r.p), r)).join('') : '<p><i>Nadie a quien fichar.</i></p>';
  const ss = seasons();
  h += `<hr class="rule"><h2 class="sect">Hemeroteca<small>La portada de cada mes. Sin derecho a réplica.</small></h2>`;
  h += ss.length ? ss.map(miniPortada).join('') : `<p class="small"><i>Esta es la primera temporada. La historia se está escribiendo ahora mismo, y no queda bonita.</i></p>`;
  return h;
}

  let body;
  if (!S.loaded) body = `<div class="empty"><span class="stamp red">IMPRIMIENDO</span><h2>Calentando rotativas…</h2></div>`;
  else if (S.error) body = emptyBlock('Se ha caído la rotativa', 'No hay manera de hablar con la base de datos. Revisa la conexión en «¿Quién eres?» → Redacción.<br><small>'+esc(S.error.slice(0,160))+'</small>', '<button class="btn red" data-a="who">REVISAR</button>');

async function hydratePhotos(){
  for (const img of document.querySelectorAll('img[data-photo]')) {
    const id = img.dataset.photo;
    if (!photoCache.has(id)) photoCache.set(id, DB.photo(id).catch(() => null));
    const src = await photoCache.get(id);
    if (src) img.src = src; else img.closest('.ph, .photo')?.remove();
  }
}

async function guarded(fn){ try{ await fn() }catch(err){ console.error(err); toast('Error de imprenta: '+String(err.message||err).slice(0,80), true, 4000) } }
const A = {
  tab: v => { S.tab = v==='juicio' ? 'muro' : v; LS.set('ddv_tab', S.tab); render(); window.scrollTo({top:0}) },
  who: () => whoModal(),
  close: () => closeModal(),
  iam: v => { setMe(v); closeModal(); toast('Firmado como «'+nick(v)+'». Ya no hay vuelta atrás.'); render() },
  // Un toque = una copa. Ignora el rebote de un doble toque accidental (<0,7 s en la misma bebida)
  drink: (v, el) => guarded(async () => {
    const now = Date.now();
    if (S.lastTap && S.lastTap.v===v && now - S.lastTap.t < 700) return;
    S.lastTap = {v, t:now};
    el.classList.add('hit'); setTimeout(() => el.classList.remove('hit'), 350);
    const d = DRINKS.find(x => x.type===v); if (!d) return;
    const saved = await DB.insert('events', {group_id:S.group, player_id:S.me, kind:'drink', type:d.type, label:d.label, points:d.points, status:'approved', month:curMonth(), has_photo:false});
    if (navigator.vibrate) navigator.vibrate(30);
    toast(`+${d.points} ${d.label}. ${pick(DRINK_QUIPS, now)}`, false, 5000, async () => {
      await DB.remove('events', saved.id); toast('Deshecho. Aquí no ha pasado nada.'); await refresh();
    });
    await refresh();
  }),
  undo: () => { const fn = toastUndo; hideToast(); if (fn) guarded(fn) },
  anecmodal: () => anecModal(),
  mode: v => { S.f.mode = v; anecModal() },
  anec: v => { S.f.anec = v; anecModal() },
  newcat: () => catModal(),
  copy: v => { navigator.clipboard?.writeText(v).then(() => toast('Enlace copiado. Que corra la voz.'), () => toast('Cópialo a mano, que el móvil no se deja.', true)) },
  share: v => { const g = curGroup();
    if (navigator.share) navigator.share({title:'Drunktasy', text:`Te reclutan para «${g ? g.name : 'la cuadrilla'}». Aquí se confiesa todo.`, url:v}).catch(() => {});
    else A.copy(v) },
  groups: () => groupsModal(),
  setgroup: v => { const g = S.groups.find(x => x.id===v); if (!g) return; closeModal(); if (v===S.group) return;
    openGroup(g); render(); refresh(); toast('Ahora en «'+g.name+'».') },
  rk: v => { S.rk = v; LS.set('ddv_rk', v); render() },
  disconnect: () => { LS.set('ddv_cfg', null); CFG = null; DB = localDB(); closeModal(); refresh() },
  anecdote: () => guarded(async () => {
    const f = S.f, def = anecDef(f.anec); if (!def) return;
    const report = f.mode==='report';
    const pid = report ? f.target : S.me; if (!pid) return;
    const row = {group_id:S.group, player_id:pid, kind:'anecdote', type:def.type, label:def.label, points:def.points, note:f.note.trim() || null,
      photo:f.photo, has_photo:!!f.photo, reported_by:report ? S.me : null, status:report ? 'pending' : 'approved', month:curMonth()};
    const saved = await DB.insert('events', row);
    if (report && saved) await DB.vote({group_id:S.group, event_id:saved.id, voter_id:S.me, approve:true});
    Object.assign(S.f, {anec:null, note:'', photo:null, target:''});
    closeModal();
   
    stamp('EXCLUSIVA', report ? 'Denuncia presentada · Pendiente de juicio' : '+'+def.points+' puntos · Ya es portada');
    await refresh();
  }),
  retract: v => guarded(async () => {
    // Doble toque: el primero arma el botón 3 s, el segundo borra. Sin confirm().
    if (S.armed !== v) { S.armed = v; clearTimeout(S.armedT); S.armedT = setTimeout(() => { S.armed = null; render() }, 3000); render(); return }
    S.armed = null; clearTimeout(S.armedT);
    await DB.remove('events', v); toast('Retractado. Cobarde.'); await refresh();
  }),
  vote: (v, el) => guarded(async () => {
    const approve = el.dataset.y === '1';
    await DB.vote({group_id:S.group, event_id:v, voter_id:S.me, approve});
    toast(approve ? 'Culpable. El pueblo te lo agradece.' : 'Inocente. Blandengue.');
    await refresh();
    const e = S.events.find(x => x.id===v);
    if (e && e.status==='approved') stamp('CONFIRMADO', 'El pueblo ha hablado · +'+e.points);
    else if (e && e.status==='rejected') stamp('ABSUELTO', 'Se libra por esta vez');
  }),
};

  if (k==='target') { S.f.target = e.target.value; anecModal() }
  if (k==='photo' && e.target.files[0]) shrink(e.target.files[0]).then(src => { S.f.photo = src; anecModal() }).catch(() => toast('Esa foto no hay quien la imprima.', true));
});
document.addEventListener('submit', e => {
  const f = e.target.dataset.f; if (!f) return; e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target));
  if (f==='addplayer') guarded(async () => {
    const name = data.name.trim(), nickname = data.nickname.trim(); if (!name || !nickname) return;
    if (S.players.some(p => p.nickname.toLowerCase()===nickname.toLowerCase())) return toast('Ese apodo ya está pillado. Echa imaginación.', true);
    const p = await DB.insert('players', {group_id:S.group, name, nickname});
    setMe(p.id); closeModal(); toast('«'+nickname+'» fichado. Bienvenido al lado oscuro.'); await refresh();
  });
  if (f==='addcat') guarded(async () => {
    const c = await DB.insert('categories', {group_id:S.group, label:data.label.trim(), points:Math.min(10, Math.max(1, +data.points||1)), emoji:(data.emoji||'🤡').trim()});
    S.f.anec = 'c_'+c.id; toast('Nuevo delito tipificado.'); await refresh(); anecModal();
  });
  if (f==='addgroup') guarded(async () => {
    const name = (data.name || '').trim(); if (!name) return;
    const g = await DB.insert('groups', {name, code:newCode()});
    closeModal(); openGroup(g); render(); await refresh();
    toast('«'+name+'» fundada. Ahora ficha y recluta.'); whoModal();
  });
  if (f==='cfg') {
    const url = data.url.trim(), key = data.key.trim();
    if (!/^https:\/\//.test(url) || !key) return toast('Eso no parece una conexión de Supabase.', true);
    CFG = {url, key}; LS.set('ddv_cfg', CFG); DB = remoteDB(CFG); closeModal(); S.loaded = false; render(); refresh();
  }
});
function shrink(file, max=900){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, max/Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', .7)) };
    img.onerror = rej; img.src = url;
  });
}

// Arranque: unirse por enlace #g=CODIGO, o recuperar el grupo de quien ya estaba fichado antes de que hubiera grupos
async function boot(){
  try{
    if (JOIN_CODE) {
      const g = (await DB.find('groups', 'code', JOIN_CODE))[0];
      if (g) { const nuevo = !S.groups.some(x => x.id===g.id); openGroup(g); toast(nuevo ? 'Te has unido a «'+g.name+'». Ahora ficha.' : 'De vuelta en «'+g.name+'».') }
      else toast('Ese enlace no lleva a ninguna cuadrilla. Pide otro.', true, 4000);
    } else if (!S.groups.length && LS.get('ddv_me', null)) {
      const p = (await DB.find('players', 'id', LS.get('ddv_me', null)))[0];
      const g = p && (await DB.find('groups', 'id', p.group_id))[0];
      if (g) { openGroup(g); setMe(p.id) }
      LS.set('ddv_me', null);
    }
  }catch(err){ console.error(err) }
  if (S.group && !S.me && JOIN_CODE) setTimeout(() => { if (!S.me && S.loaded && !S.error) whoModal() }, 1200);
  await refresh();
}
// Si ya tenías la app abierta y tocas una invitación, solo cambia el #: recargamos para procesarla
addEventListener('hashchange', () => { if (/(^|[#&])(g|sb)=/.test(location.hash)) location.reload() });
render();
boot();
setInterval(() => { if (!document.hidden) refresh() }, POLL_MS);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh() });
</script>
